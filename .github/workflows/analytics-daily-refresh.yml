name: Daily analytics warm-up and refresh

on:
  schedule:
    # One daily run: wake Render at 04:50, then refresh at or after 05:00.
    - cron: "50 4 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wake the Render free web service
        env:
          ANALYTICS_CRON_URL: ${{ secrets.ANALYTICS_CRON_URL }}
        run: |
          test -n "$ANALYTICS_CRON_URL"
          health_url="${ANALYTICS_CRON_URL%/api/analytics-cron}/health"
          healthy=""
          for wake_attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 90 "$health_url" | jq -e '.status == "ok"' >/dev/null 2>&1; then
              healthy="true"
              echo "Render is awake and healthy."
              break
            fi
            echo "Waiting for the Render service to wake up (attempt $wake_attempt/24)..."
            sleep 10
          done
          test "$healthy" = "true"

      - name: Wait until 05:00 Asia/Kolkata
        run: |
          now_epoch=$(date +%s)
          india_date=$(TZ=Asia/Kolkata date +%F)
          refresh_epoch=$(TZ=Asia/Kolkata date --date "$india_date 05:00:00" +%s)
          if [ "$now_epoch" -lt "$refresh_epoch" ]; then
            wait_seconds=$((refresh_epoch - now_epoch))
            echo "Waiting $wait_seconds seconds for 05:00 Asia/Kolkata."
            sleep "$wait_seconds"
          else
            echo "05:00 Asia/Kolkata has already passed; refreshing now."
          fi

      - name: Refresh stores whose local morning has started
        env:
          ANALYTICS_CRON_URL: ${{ secrets.ANALYTICS_CRON_URL }}
          ANALYTICS_CRON_SECRET: ${{ secrets.ANALYTICS_CRON_SECRET }}
        run: |
          test -n "$ANALYTICS_CRON_URL"
          test -n "$ANALYTICS_CRON_SECRET"
          skip_store_ids=""
          failure_report=""
          for attempt in $(seq 1 60); do
            response=""
            for wake_attempt in $(seq 1 12); do
              request_headers=(
                --header "Authorization: Bearer $ANALYTICS_CRON_SECRET"
                --header "Accept: application/json"
              )
              if [ -n "$skip_store_ids" ]; then
                request_headers+=(--header "X-Analytics-Skip-Store-Ids: $skip_store_ids")
              fi
              candidate=$(curl --silent --show-error --max-time 90 \
                --request POST \
                "${request_headers[@]}" \
                "$ANALYTICS_CRON_URL" || true)
              if echo "$candidate" | jq -e 'type == "object" and has("processed")' >/dev/null 2>&1; then
                response="$candidate"
                break
              fi
              echo "Waiting for the web service to wake up (attempt $wake_attempt/12)..."
              sleep 10
            done
            test -n "$response"
            echo "$response"
            new_failure_ids=$(echo "$response" | jq -r '[.failures[]?.storeId | select(. != null) | tostring] | join(",")')
            if [ -n "$new_failure_ids" ]; then
              if [ -n "$skip_store_ids" ]; then
                skip_store_ids="$skip_store_ids,$new_failure_ids"
              else
                skip_store_ids="$new_failure_ids"
              fi
            fi
            new_failure_report=$(echo "$response" | jq -r '[.failures[]? | "\(.shopDomain // "unknown store") [\(.phase)]: \(.error)"] | join("; ")')
            if [ -n "$new_failure_report" ]; then
              if [ -n "$failure_report" ]; then
                failure_report="$failure_report; $new_failure_report"
              else
                failure_report="$new_failure_report"
              fi
            fi
            processed=$(echo "$response" | jq -r '.processed // false')
            remaining=$(echo "$response" | jq -r '.remainingDue // 0')
            if [ "$remaining" = "0" ] || [ "$processed" != "true" ]; then
              break
            fi
            sleep 5
          done
          if [ -n "$failure_report" ]; then
            echo "::error title=Analytics refresh needs attention::$failure_report"
            exit 1
          fi
